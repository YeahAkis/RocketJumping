plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

base {
    archivesName = "${rootProject.name}-neoforge"
}

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        server {
            server()
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(rootProject.mod_java_version)
}

processResources {
    def props = [
            version  : project.version,
            minecraft: rootProject.minecraft_version,
            neoforge : rootProject.neoforge_version.split('\\.').take(2).join('.'),
            java     : rootProject.mod_java_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

ext.publishFile = tasks.jar.archiveFile
ext.publishSuffix = 'neoforge'
ext.publishLabel = 'NeoForge'
ext.publishLoaders = ['neoforge']
apply from: '../gradle/publish.gradle'
