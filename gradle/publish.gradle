apply plugin: 'me.modmuss50.mod-publish-plugin'

String changelogFor(String text, String ver) {
    List<String> section = []
    boolean inside = false
    for (String line : text.readLines()) {
        if (line.startsWith('## ')) {
            if (inside) {
                break
            }
            inside = line.substring(3).trim() == ver
        } else if (inside) {
            section.add(line)
        }
    }
    String entry = section.join('\n').trim()
    if (entry.isEmpty()) {
        throw new GradleException("CHANGELOG.md has no entry for ${ver}")
    }
    return entry
}

def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse(providers.gradleProperty('modrinthToken')).filter { !it.isBlank() }
def versionName = project.version.toString()

publishMods {
    file = project.ext.publishFile
    version = "${versionName}+${rootProject.minecraft_version}-${project.ext.publishSuffix}"
    displayName = "${rootProject.mod_name} ${versionName} for ${rootProject.minecraft_version} (${project.ext.publishLabel})"
    changelog = providers.fileContents(rootProject.layout.projectDirectory.file('CHANGELOG.md')).asText.map { changelogFor(it, versionName) }
    type = versionName.contains('alpha') ? ALPHA : (versionName.contains('beta') ? BETA : STABLE)
    modLoaders.addAll(project.ext.publishLoaders)
    dryRun = !modrinthToken.present

    modrinth {
        projectId = rootProject.modrinth_id
        accessToken = modrinthToken
        minecraftVersions.addAll(rootProject.minecraft_version)
    }
}
